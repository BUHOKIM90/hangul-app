name: voice-gemini
# Gemini TTS comparison samples (free tier: 12 requests). Needs the GEMINI_API_KEY repository secret. Run by hand.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: python3 v6/tools/voice/gemini_samples.py
        env: { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}' }
      - run: |
          git config user.name "voice-bot"
          git config user.email "voice-bot@users.noreply.github.com"
          git add v6/voice-samples
          git commit -m "voice: Gemini TTS 비교 샘플 (목소리 고르기)" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
