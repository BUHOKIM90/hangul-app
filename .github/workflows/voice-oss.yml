name: voice-oss
# Open-source Korean voices (NVIDIA Magpie, OmniVoice): samples for 목소리 고르기 + automatic scores vs the current voice.
on:
  workflow_dispatch:
    inputs:
      parts: { default: '["qwen:sohee","qwen:kss"]' }
permissions:
  contents: write
concurrency: voice-oss
jobs:
  gen:
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.parts || '["qwen:sohee","qwen:kss"]') }}
    runs-on: ubuntu-latest
    env: { GITHUB_TOKEN: '${{ github.token }}' }
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libsndfile1 sox
      - run: pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -q faster-whisper soundfile numpy transformers librosa
      - if: startsWith(matrix.part, 'magpie')
        run: pip install -q "nemo_toolkit[tts] @ git+https://github.com/NVIDIA/NeMo.git@main" kaldialign peft
      - if: startsWith(matrix.part, 'qwen')
        run: pip install -q qwen-tts pyarrow huggingface_hub
      - if: startsWith(matrix.part, 'omnivoice')
        run: pip install -q omnivoice
      - if: matrix.part == 'baseline'
        run: python v6/tools/voice/oss_tts.py baseline
      - if: matrix.part != 'baseline'
        run: |
          P='${{ matrix.part }}'
          python v6/tools/voice/oss_tts.py samples --engine "${P%%:*}" --voices "${P#*:}"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "oss-${{ strategy.job-index }}", path: out, if-no-files-found: ignore }
  merge:
    needs: gen
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out }
      - run: python3 v6/tools/voice/oss_merge.py
      - run: |
          git config user.name "voice-bot"
          git config user.email "voice-bot@users.noreply.github.com"
          git add v6/voice-samples v6/tools/voice/oss_scores.json
          git commit -m "voice: 오픈소스 한국어 음성 후보 샘플과 자동 점수 (Magpie, OmniVoice)" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
