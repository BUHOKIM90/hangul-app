<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF9EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한글 놀이">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'">
<title>한글 놀이</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-512-maskable.png">
<link rel="preload" href="fonts/Jua-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" as="image" fetchpriority="high" imagesrcset="assets/pic/scene_01-800.webp 800w, assets/pic/scene_01.webp 1024w" imagesizes="100vw">
<link rel="stylesheet" href="v5/css/app.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button type="button" id="homeBtn" class="tap icon" data-tap="go-home" hidden aria-label="처음으로">홈</button>
    <p id="brand">한글 놀이</p>
    <button type="button" id="soundBtn" class="tap sound is-on" data-tap="sound" aria-pressed="true" aria-label="소리 켜짐"><img alt="" src="assets/icons/speaker.svg"></button>
    <button type="button" id="adultBtn" class="tap icon" data-tap="adult" aria-label="어른 메뉴">어른</button>
  </header>
  <main id="main" data-screen="home">
    <section class="home">
      <div class="scene">
        <img class="scene-bg" alt="" width="1024" height="768" fetchpriority="high" sizes="100vw" src="assets/pic/scene_01-800.webp" srcset="assets/pic/scene_01-800.webp 800w, assets/pic/scene_01.webp 1024w">
        <img class="sky-sun" alt="" src="assets/icons/sun.svg">
        <img class="sky-cloud sky-cloud-a" alt="" src="assets/pic/cloud_smile.webp">
        <img class="sky-cloud sky-cloud-b" alt="" src="assets/pic/cloud_surprise.webp">
        <img class="sky-cloud sky-cloud-c" alt="" src="assets/pic/cloud_sleepy.webp">
        <div class="scene-top">
          <p class="meta" id="home-meta">가족 소리 · 스티커 0/120</p>
          <p id="bubble" class="home-say">오늘도 같이 놀자</p>
          <p class="today-place" id="today-place">몽글이 집</p>
          <div class="today-art" id="today-art">
            <figure><img alt="" src="assets/pic/eomma.webp"><figcaption>엄마</figcaption></figure>
            <figure><img alt="" src="assets/stickers/hangul_08_ㅇ친구.webp"><figcaption>ㅇ</figcaption></figure>
            <figure><img alt="" src="assets/stickers/hangul_15_ㅏ친구.webp"><figcaption>ㅏ</figcaption></figure>
          </div>
        </div>
        <div class="cast" id="friend-row"></div>
        <div class="buddy" id="buddy"><img alt="" width="512" height="512" sizes="(min-width: 800px) 28vw, 42vw" src="assets/char/monggeul_wave-256.webp" srcset="assets/char/monggeul_wave-256.webp 256w, assets/char/monggeul_wave.webp 512w"></div>
        <div class="home-dock">
          <button type="button" class="tap play-go" data-tap="go-map"><img alt="" src="assets/icons/play.svg"><span>놀자</span></button>
          <button type="button" class="tap pic-tile" data-tap="stickers"><img alt="" src="assets/stickers/animal_04_곰.webp"><span>스티커</span></button>
          <button type="button" class="tap pic-tile" data-tap="dress"><img alt="" src="assets/friends/tori.webp"><span>옷</span></button>
        </div>
      </div>
    </section>
  </main>
</div>
<p id="live" class="sr-only" aria-live="polite"></p>
<div id="fx" aria-hidden="true"></div>
<div id="praise" hidden></div>
<div id="gate" hidden></div>
<div id="parent" hidden></div>
<script defer src="audio/lines.js"></script>
<script defer src="audio/have.js"></script>
<script defer src="v5/js/mong-webp.js"></script>
<script defer src="v5/js/content.js"></script>
<script defer src="v5/js/stickers.js"></script>
<script defer src="v5/js/engine.js"></script>
<script defer src="v5/js/plays.js"></script>
<script defer src="v5/js/app.js"></script>
</body>
</html>
